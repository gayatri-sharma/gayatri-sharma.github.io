<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"><title>VoltX charging workflow</title><defs><clipPath id="round-car"><circle cx="170" cy="245" r="72"/></clipPath><clipPath id="round-drive"><circle cx="730" cy="245" r="72"/></clipPath></defs><rect width="900" height="500" rx="24" fill="#101719"/><text x="52" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">How VoltX works</text><text x="52" y="102" fill="#b8c4c5" font-family="Arial,sans-serif" font-size="17">Connect · compare · get notified · drive</text><g font-family="Arial,sans-serif" text-anchor="middle"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.22;.27;.95;1" dur="16s" repeatCount="indefinite"/><circle cx="170" cy="245" r="72" fill="#26383a"/><image href="assets/tesla-charging.gif" x="98" y="173" width="144" height="144" preserveAspectRatio="xMidYMid slice" clip-path="url(#round-car)"/><text x="170" y="355" fill="#e82127" font-size="22" font-weight="700">1 · CONNECT TO TESLA</text><text x="170" y="385" fill="#d7dfdf" font-size="16">Read your car’s location</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.27;.55;.62" dur="16s" repeatCount="indefinite"/><circle cx="450" cy="245" r="72" fill="#26383a"/><image href="assets/charger-pin.jpg" x="392" y="187" width="116" height="116" preserveAspectRatio="xMidYMid meet"/><text x="450" y="355" fill="#e82127" font-size="22" font-weight="700">2 · LOW RATE FOUND</text><text x="450" y="385" fill="#d7dfdf" font-size="16">$0.39/kWh · 2.4 mi away</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.5;.55;.62;.83;.9" dur="16s" repeatCount="indefinite"/><rect x="235" y="160" width="430" height="120" rx="14" fill="#fff"/><circle cx="270" cy="200" r="20" fill="#e82127"/><path d="M270 186c-7 0-11 5-11 12v7l-5 6h32l-5-6v-7c0-7-4-12-11-12zm0 27a5 5 0 0 0 5-5h-10a5 5 0 0 0 5 5z" fill="#fff"/><text x="305" y="205" text-anchor="start" fill="#202124" font-size="19" font-weight="700">VoltX found a low rate</text><text x="305" y="238" text-anchor="start" fill="#4e5960" font-size="16">Oak Grove Supercharger · $0.39/kWh</text><text x="450" y="355" fill="#e82127" font-size="22" font-weight="700">3 · NOTIFY AND DRIVE</text><text x="450" y="385" fill="#d7dfdf" font-size="16">No repeated app checking</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.75;.8;.83;.9;.98;1" dur="16s" repeatCount="indefinite"/><circle cx="730" cy="245" r="72" fill="#26383a"/><image href="assets/tesla-driving.jpg" x="658" y="173" width="144" height="144" preserveAspectRatio="xMidYMid slice" clip-path="url(#round-drive)"/><text x="730" y="355" fill="#e82127" font-size="22" font-weight="700">4 · CHARGE</text><text x="730" y="385" fill="#d7dfdf" font-size="16">Drive to the charger</text></g></g></svg>
