<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">VoltX charging alert walkthrough</title><desc id="desc">An animated demonstration of connecting Tesla, finding a low rate, receiving a notification, and driving to a charger.</desc><rect width="900" height="500" rx="24" fill="#101719"/><text x="52" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">How VoltX works</text><text x="52" y="102" fill="#b8c4c5" font-family="Arial,sans-serif" font-size="17">Connect · compare · get notified · drive</text><g font-family="Arial,sans-serif" text-anchor="middle"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.22;.27;.95;1" dur="12s" repeatCount="indefinite"/><circle cx="170" cy="245" r="72" fill="#26383a"/><text x="170" y="260" font-size="62">🚗</text><text x="170" y="355" fill="#c91d24" font-size="22" font-weight="700">1 · CONNECT TO TESLA</text><text x="170" y="385" fill="#d7dfdf" font-size="16">Read your car’s location</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.27;.55;.62" dur="12s" repeatCount="indefinite"/><circle cx="450" cy="245" r="72" fill="#26383a"/><text x="450" y="260" font-size="62">🔔</text><text x="450" y="355" fill="#c91d24" font-size="22" font-weight="700">2 · LOW RATE FOUND</text><text x="450" y="385" fill="#d7dfdf" font-size="16">$0.39/kWh · 2.4 mi away</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.5;.55;.62;.83;.9" dur="12s" repeatCount="indefinite"/><rect x="235" y="160" width="430" height="120" rx="14" fill="#fff"/><circle cx="270" cy="200" r="9" fill="#c91d24"/><text x="295" y="205" text-anchor="start" fill="#202124" font-size="19" font-weight="700">VoltX found a low rate</text><text x="295" y="238" text-anchor="start" fill="#4e5960" font-size="16">Oak Grove Supercharger · $0.39/kWh</text><text x="450" y="355" fill="#c91d24" font-size="22" font-weight="700">3 · NOTIFY AND DRIVE</text><text x="450" y="385" fill="#d7dfdf" font-size="16">No repeated app checking</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.75;.8;.83;.9;.98;1" dur="12s" repeatCount="indefinite"/><circle cx="730" cy="245" r="72" fill="#26383a"/><text x="730" y="260" font-size="62">⚡</text><text x="730" y="355" fill="#c91d24" font-size="22" font-weight="700">4 · CHARGE</text><text x="730" y="385" fill="#d7dfdf" font-size="16">Drive to the charger</text></g></g></svg>
