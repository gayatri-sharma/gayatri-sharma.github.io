<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"><title>VoltX finds a low-rate Supercharger</title><defs><clipPath id="car-window"><rect x="38" y="257" width="108" height="78" rx="16"/></clipPath><clipPath id="drive-window"><rect x="-54" y="-43" width="108" height="86" rx="16"/></clipPath><filter id="soft-glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="route" d="M92 304 C230 352 312 340 412 286 S640 164 790 218"/></defs><rect width="900" height="500" rx="24" fill="#101719"/><text x="48" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">VoltX finds the better charge</text><text x="48" y="88" fill="#9fb0b1" font-family="Arial,sans-serif" font-size="16">It watches nearby rates so you can keep driving.</text><rect x="32" y="116" width="836" height="312" rx="20" fill="#152022" stroke="#2f4547"/><path d="M55 178h790M55 253h790M55 328h790M180 135v280M350 135v280M520 135v280M690 135v280" stroke="#213235" stroke-width="1" opacity=".8"/><circle cx="790" cy="218" r="80" fill="#233739" opacity=".45"/><use href="#route" fill="none" stroke="#334c4e" stroke-width="11" stroke-linecap="round"/><use href="#route" fill="none" stroke="#e82127" stroke-width="5" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900" filter="url(#soft-glow)"><animate attributeName="stroke-dashoffset" values="900;0;0;900" keyTimes="0;.42;.78;1" dur="18s" repeatCount="indefinite"/></use><g font-family="Arial,sans-serif"><g><rect x="58" y="146" width="152" height="42" rx="12" fill="#203336"/><text x="78" y="172" fill="#c5d0d0" font-size="14">YOUR TESLA</text><circle cx="193" cy="167" r="6" fill="#7bd66e"><animate attributeName="fill" values="#7bd66e;#e82127;#7bd66e" dur="3s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.34;.39;.82;1" dur="18s" repeatCount="indefinite"/><rect x="694" y="137" width="130" height="50" rx="12" fill="#e82127"/><text x="759" y="158" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">LOW RATE FOUND</text><text x="759" y="176" text-anchor="middle" fill="#fff" font-size="12">$0.39/kWh</text></g><g><rect x="38" y="257" width="108" height="78" rx="16" fill="#26383a"/><image href="assets/tesla-charging.gif" x="38" y="257" width="108" height="78" preserveAspectRatio="xMidYMid slice" clip-path="url(#car-window)"/><text x="92" y="365" text-anchor="middle" fill="#d7dfdf" font-size="13">Parked and watching</text></g><g><circle cx="790" cy="218" r="31" fill="#e82127"/><path d="M790 197c-8 0-12 6-12 14v7l-6 7h36l-6-7v-7c0-8-4-14-12-14zm0 31a6 6 0 0 0 6-6h-12a6 6 0 0 0 6 6z" fill="#fff"/><image href="assets/charger-pin.jpg" x="755" y="238" width="70" height="70" preserveAspectRatio="xMidYMid meet" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.34;.4;1" dur="18s" repeatCount="indefinite"/></image><text x="790" y="330" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Oak Grove</text><text x="790" y="348" text-anchor="middle" fill="#9fb0b1" font-size="13">2.4 mi away</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.44;.82;1" dur="18s" repeatCount="indefinite"/><rect x="274" y="134" width="350" height="78" rx="16" fill="#fff"/><circle cx="310" cy="173" r="21" fill="#e82127"/><path d="M310 159c-8 0-12 6-12 14v7l-6 7h36l-6-7v-7c0-8-4-14-12-14zm0 31a6 6 0 0 0 6-6h-12a6 6 0 0 0 6 6z" fill="#fff"/><text x="346" y="169" fill="#1b2527" font-size="16" font-weight="700">VoltX found a low rate</text><text x="346" y="191" fill="#566467" font-size="14">Oak Grove Supercharger · $0.39/kWh</text></g><g><animateMotion dur="18s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion><rect x="-54" y="-43" width="108" height="86" rx="16" fill="#e82127"/><image href="assets/tesla-driving.jpg" x="-54" y="-43" width="108" height="86" preserveAspectRatio="xMidYMid slice" clip-path="url(#drive-window)"/></g></g><text x="450" y="464" text-anchor="middle" fill="#8ea0a2" font-family="Arial,sans-serif" font-size="14">Connect once · get the alert · drive to the charger</text></svg>
