<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"><title>VoltX charging alert story</title><defs><linearGradient id="shade" x1="0" x2="1"><stop stop-color="#101719" stop-opacity=".08"/><stop offset="1" stop-color="#101719" stop-opacity=".94"/></linearGradient></defs><rect width="900" height="500" rx="24" fill="#101719"/><g><animate calcMode="discrete" attributeName="opacity" values="1;1;0;0" keyTimes="0;.25;.30;1" dur="15s" repeatCount="indefinite"/><image href="assets/tesla-charging.gif" width="900" height="500" preserveAspectRatio="xMidYMid slice"/><rect width="900" height="500" fill="url(#shade)"/><text x="66" y="96" fill="#e82127" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">01 · CONNECTED</text><text x="66" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">Your Tesla is ready.</text><text x="66" y="186" fill="#d6dfdf" font-family="Arial,sans-serif" font-size="18">VoltX quietly watches nearby Supercharger rates.</text></g><g opacity="0"><animate calcMode="discrete" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.30;.65;.70;1" dur="15s" repeatCount="indefinite"/><rect width="900" height="500" fill="#101719"/><text x="66" y="82" fill="#e82127" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">02 · LOW RATE FOUND</text><text x="66" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">A better rate is here.</text><text x="66" y="164" fill="#b9c5c6" font-family="Arial,sans-serif" font-size="17">VoltX sends the notification so you can stop checking.</text><image href="assets/charger-pin.jpg" x="628" y="146" width="124" height="124" preserveAspectRatio="xMidYMid meet"/><rect x="66" y="266" width="500" height="92" rx="15" fill="#1c2628" stroke="#e82127" stroke-width="2"/><circle cx="106" cy="312" r="22" fill="#e82127"/><path d="M106 298c-8 0-12 6-12 14v7l-6 7h36l-6-7v-7c0-8-4-14-12-14zm0 31a6 6 0 0 0 6-6h-12a6 6 0 0 0 6 6z" fill="#fff"/><text x="146" y="307" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">VoltX found the lowest rate</text><text x="146" y="331" fill="#b9c5c6" font-family="Arial,sans-serif" font-size="14">Thornton Avenue · $0.39/kWh · 2.0 mi</text></g><g opacity="0"><animate calcMode="discrete" attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.70;.75;.98;1" dur="15s" repeatCount="indefinite"/><image href="assets/tesla-driving.jpg" width="900" height="500" preserveAspectRatio="xMidYMid slice"/><rect width="900" height="500" fill="#101719" opacity=".48"/><text x="66" y="104" fill="#e82127" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">03 · ON THE WAY</text><text x="66" y="158" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">Now you can drive.</text><text x="66" y="196" fill="#e1e8e8" font-family="Arial,sans-serif" font-size="18">No repeated Tesla app checking. Just follow the alert.</text></g><g><circle cx="420" cy="460" r="4" fill="#e82127"><animate attributeName="fill" values="#e82127;#727b7d;#727b7d;#727b7d;#e82127" keyTimes="0;.25;.32;.80;1" dur="15s" repeatCount="indefinite"/></circle><circle cx="450" cy="460" r="6" fill="#727b7d"><animate attributeName="fill" values="#727b7d;#727b7d;#e82127;#727b7d;#727b7d" keyTimes="0;.25;.32;.80;1" dur="15s" repeatCount="indefinite"/></circle><circle cx="480" cy="460" r="4" fill="#727b7d"><animate attributeName="fill" values="#727b7d;#727b7d;#727b7d;#e82127;#727b7d" keyTimes="0;.68;.80;.84;1" dur="15s" repeatCount="indefinite"/></circle></g></svg>
