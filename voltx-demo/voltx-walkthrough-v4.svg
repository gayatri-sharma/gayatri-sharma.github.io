  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img">
  <title>VoltX charging workflow</title>
  <defs><clipPath id="carClip"><circle cx="126" cy="235" r="54"/></clipPath><clipPath id="driveClip"><circle cx="774" cy="235" r="54"/></clipPath><filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="500" rx="24" fill="#101719"/><text x="52" y="68" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">How VoltX works</text><text x="52" y="100" fill="#b8c4c5" font-family="Arial,sans-serif" font-size="17">Connect · compare · get notified · drive</text><text x="848" y="68" text-anchor="end" fill="#91a4a5" font-family="Arial,sans-serif" font-size="14">AUTOMATED RATE WATCH</text>
  <line x1="126" y1="235" x2="774" y2="235" stroke="#314446" stroke-width="6" stroke-linecap="round"/><line x1="126" y1="235" x2="774" y2="235" stroke="#e82127" stroke-width="6" stroke-linecap="round" stroke-dasharray="648" stroke-dashoffset="648" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="648;0;0;648" keyTimes="0;.58;.82;1" dur="16s" repeatCount="indefinite"/></line>
  <circle cx="126" cy="235" r="9" fill="#e82127"><animate attributeName="r" values="8;12;8" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="342" cy="235" r="9" fill="#e82127"><animate attributeName="r" values="8;12;8" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="558" cy="235" r="9" fill="#e82127"><animate attributeName="r" values="8;12;8" dur="2.4s" begin="2.4s" repeatCount="indefinite"/></circle><circle cx="774" cy="235" r="9" fill="#e82127"><animate attributeName="r" values="8;12;8" dur="2.4s" begin="3.6s" repeatCount="indefinite"/></circle>
  <g font-family="Arial,sans-serif"><g text-anchor="middle"><circle cx="126" cy="235" r="54" fill="#26383a" stroke="#e82127" stroke-width="2"/><image href="assets/tesla-charging.gif" x="72" y="181" width="108" height="108" preserveAspectRatio="xMidYMid slice" clip-path="url(#carClip)"/><text x="126" y="330" fill="#fff" font-size="17" font-weight="700">1 · CONNECT</text><text x="126" y="354" fill="#b8c4c5" font-size="14">Read your Tesla location</text></g><g text-anchor="middle"><circle cx="342" cy="235" r="54" fill="#26383a" stroke="#e82127" stroke-width="2"/><image href="assets/charger-pin.jpg" x="298" y="191" width="88" height="88" preserveAspectRatio="xMidYMid meet"/><text x="342" y="330" fill="#fff" font-size="17" font-weight="700">2 · COMPARE</text><text x="342" y="354" fill="#b8c4c5" font-size="14">Scan chargers nearby</text></g><g text-anchor="middle"><rect x="468" y="181" width="180" height="108" rx="16" fill="#fff" stroke="#e82127" stroke-width="3"><animate attributeName="stroke-width" values="3;6;3" dur="2.4s" begin="2.4s" repeatCount="indefinite"/></rect><circle cx="500" cy="216" r="18" fill="#e82127"/><path d="M500 204c-7 0-11 5-11 12v7l-5 6h32l-5-6v-7c0-7-4-12-11-12zm0 27a5 5 0 0 0 5-5h-10a5 5 0 0 0 5 5z" fill="#fff"/><text x="522" y="219" text-anchor="start" fill="#202124" font-size="15" font-weight="700">LOW RATE ALERT</text><text x="486" y="251" text-anchor="start" fill="#4e5960" font-size="13">Oak Grove · $0.39/kWh</text><text x="558" y="330" fill="#fff" font-size="17" font-weight="700">3 · NOTIFY</text><text x="558" y="354" fill="#b8c4c5" font-size="14">No repeated app checks</text></g><g text-anchor="middle"><circle cx="774" cy="235" r="54" fill="#26383a" stroke="#e82127" stroke-width="2"/><image href="assets/tesla-driving.jpg" x="720" y="181" width="108" height="108" preserveAspectRatio="xMidYMid slice" clip-path="url(#driveClip)"/><text x="774" y="330" fill="#fff" font-size="17" font-weight="700">4 · DRIVE</text><text x="774" y="354" fill="#b8c4c5" font-size="14">Head to the charger</text></g></g><text x="450" y="432" text-anchor="middle" fill="#8ea0a2" font-family="Arial,sans-serif" font-size="14">VoltX watches the rate so you can keep driving.</text>
</svg>
