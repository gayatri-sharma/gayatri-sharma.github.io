<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"><title>VoltX charging alert story</title><defs><linearGradient id="shade" x1="0" x2="1"><stop stop-color="#101719" stop-opacity=".1"/><stop offset="1" stop-color="#101719" stop-opacity=".94"/></linearGradient></defs><rect width="900" height="500" rx="24" fill="#101719"/><g><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.28;.34;.98;1;1" dur="15s" repeatCount="indefinite"/><image href="assets/tesla-charging.gif" x="0" y="0" width="900" height="500" preserveAspectRatio="xMidYMid slice"/><rect width="900" height="500" fill="url(#shade)"/><text x="66" y="96" fill="#e82127" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">01 · CONNECTED</text><text x="66" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">Your Tesla is ready.</text><text x="66" y="186" fill="#d6dfdf" font-family="Arial,sans-serif" font-size="18">VoltX quietly watches nearby Supercharger rates.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.24;.32;.68;.80" dur="15s" repeatCount="indefinite"/><rect width="900" height="500" fill="#f4f5f6"/><circle cx="450" cy="190" r="86" fill="#e82127"/><image href="assets/charger-pin.jpg" x="384" y="124" width="132" height="132" preserveAspectRatio="xMidYMid meet"/><text x="450" y="118" text-anchor="middle" fill="#e82127" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">02 · LOW RATE FOUND</text><text x="450" y="330" text-anchor="middle" fill="#172022" font-family="Arial,sans-serif" font-size="34" font-weight="700">A lower rate is here.</text><text x="450" y="365" text-anchor="middle" fill="#657275" font-family="Arial,sans-serif" font-size="18">Thornton Avenue · $0.39/kWh · 2.0 mi</text><circle cx="450" cy="420" r="5" fill="#e82127"/><text x="450" y="455" text-anchor="middle" fill="#7c898b" font-family="Arial,sans-serif" font-size="14">VoltX sends the alert for you</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;.74;.80;.84;.90;1" dur="15s" repeatCount="indefinite"/><image href="assets/tesla-driving.jpg" x="0" y="0" width="900" height="500" preserveAspectRatio="xMidYMid slice"/><rect width="900" height="500" fill="#101719" opacity=".46"/><text x="66" y="104" fill="#e82127" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">03 · ON THE WAY</text><text x="66" y="158" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">Now you can drive.</text><text x="66" y="196" fill="#e1e8e8" font-family="Arial,sans-serif" font-size="18">No repeated Tesla app checking. Just follow the alert.</text><rect x="66" y="356" width="330" height="66" rx="13" fill="#fff"/><circle cx="100" cy="389" r="18" fill="#e82127"/><path d="M100 377c-7 0-11 5-11 12v7l-5 6h32l-5-6v-7c0-7-4-12-11-12zm0 28a5 5 0 0 0 5-5h-10a5 5 0 0 0 5 5z" fill="#fff"/><text x="130" y="387" fill="#172022" font-family="Arial,sans-serif" font-size="14" font-weight="700">Low rate found</text><text x="130" y="406" fill="#657275" font-family="Arial,sans-serif" font-size="12">Thornton Avenue · $0.39/kWh</text></g><g fill="#fff"><circle cx="420" cy="476" r="4" opacity=".35"/><circle cx="450" cy="476" r="6" fill="#e82127"/><circle cx="480" cy="476" r="4" opacity=".35"/></g></svg>