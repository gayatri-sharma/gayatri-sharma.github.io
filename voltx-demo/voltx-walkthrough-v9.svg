<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"><title>VoltX charging workflow</title><defs><clipPath id="one"><rect x="52" y="150" width="236" height="145" rx="14"/></clipPath><clipPath id="three"><rect x="612" y="150" width="236" height="145" rx="14"/></clipPath></defs><rect width="900" height="500" rx="24" fill="#f4f5f6"/><text x="42" y="52" fill="#172022" font-family="Arial,sans-serif" font-size="29" font-weight="700">From connected to charged</text><text x="42" y="80" fill="#657275" font-family="Arial,sans-serif" font-size="16">VoltX finds the lowest nearby rate and lets you keep driving.</text><g font-family="Arial,sans-serif"><rect x="32" y="112" width="256" height="306" rx="18" fill="#172022"/><image href="assets/tesla-charging.gif" x="52" y="150" width="236" height="145" preserveAspectRatio="xMidYMid slice" clip-path="url(#one)"/><text x="56" y="331" fill="#e82127" font-size="13" letter-spacing="2">01 · CONNECT</text><text x="56" y="360" fill="#fff" font-size="20" font-weight="700">Tesla is ready</text><text x="56" y="386" fill="#9fb0b1" font-size="14">Location and rates are monitored.</text><line x1="288" y1="265" x2="312" y2="265" stroke="#e82127" stroke-width="3"/><path d="m307 258 9 7-9 7" fill="none" stroke="#e82127" stroke-width="3"/><rect x="312" y="112" width="276" height="306" rx="18" fill="#fff" stroke="#e82127" stroke-width="3"><animate attributeName="stroke-width" values="3;6;3" dur="2.8s" repeatCount="indefinite"/></rect><circle cx="450" cy="215" r="66" fill="#e82127"/><image href="assets/charger-pin.jpg" x="400" y="165" width="100" height="100" preserveAspectRatio="xMidYMid meet"/><text x="338" y="331" fill="#e82127" font-size="13" letter-spacing="2">02 · LOW RATE FOUND</text><text x="338" y="360" fill="#172022" font-size="20" font-weight="700">Thornton Avenue</text><text x="338" y="386" fill="#657275" font-size="15">$0.39/kWh · 2.0 mi away</text><line x1="588" y1="265" x2="612" y2="265" stroke="#e82127" stroke-width="3"/><path d="m607 258 9 7-9 7" fill="none" stroke="#e82127" stroke-width="3"/><rect x="612" y="112" width="256" height="306" rx="18" fill="#172022"/><image href="assets/tesla-driving.jpg" x="612" y="150" width="236" height="145" preserveAspectRatio="xMidYMid slice" clip-path="url(#three)"/><text x="636" y="331" fill="#e82127" font-size="13" letter-spacing="2">03 · DRIVE</text><text x="636" y="360" fill="#fff" font-size="20" font-weight="700">Go when it’s right</text><text x="636" y="386" fill="#9fb0b1" font-size="14">No repeated app checking.</text></g><text x="450" y="462" text-anchor="middle" fill="#7c898b" font-family="Arial,sans-serif" font-size="14">Connect once · get the alert · charge at the better rate</text></svg>
